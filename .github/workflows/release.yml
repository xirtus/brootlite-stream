name: Release Prebuilts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to attach artifacts to (e.g. v2.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  android-tv:
    name: Android TV Release APK (armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="${GITHUB_REF_NAME:-v2.1.0}"
          mkdir -p dist-artifacts
          cp app/build/outputs/apk/release/app-release.apk "dist-artifacts/BrootLite-Stream-${VERSION}-android-tv.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: dist-artifacts/*.apk

  macos-arm64:
    name: macOS Apple Silicon (.dmg & .zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> target"
      - name: Build Swift 6 BrootLite.app & DMG
        run: |
          chmod +x ./macos/scripts/build-app.sh
          ./macos/scripts/build-app.sh
          VERSION="${GITHUB_REF_NAME:-v2.1.0}"
          mkdir -p dist-artifacts
          ditto -c -k --sequesterRsrc --keepParent macos/dist/BrootLite.app "dist-artifacts/BrootLite-Stream-${VERSION}-macos-arm64.zip"
          hdiutil create -volname "BrootLite Stream" -srcfolder macos/dist/BrootLite.app -ov -format UDZO "dist-artifacts/BrootLite-Stream-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-artifacts/*

  linux-x86_64:
    name: Linux x86_64 Desktop (iced + libmpv)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential cmake libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libmpv-dev libdbus-1-dev libsecret-1-dev
      - name: Build Linux Release Binary
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml
          VERSION="${GITHUB_REF_NAME:-v2.1.0}"
          STAGE="brootlite-stream-${VERSION}-linux-x86_64"
          mkdir -p "${STAGE}" dist-artifacts
          cp desktop/target/release/brootlite-desktop "${STAGE}/"
          cp README.md "${STAGE}/"
          tar -czf "dist-artifacts/BrootLite-Stream-${VERSION}-linux-x86_64.tar.gz" "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist-artifacts/*.tar.gz

  windows-x86_64:
    name: Windows x86_64 Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
      - name: Build Windows Release Binary
        shell: bash
        run: |
          cargo build --release --manifest-path desktop/Cargo.toml
          VERSION="${GITHUB_REF_NAME:-v2.1.0}"
          STAGE="brootlite-stream-${VERSION}-windows-x86_64"
          mkdir -p "${STAGE}" dist-artifacts
          cp desktop/target/release/brootlite-desktop.exe "${STAGE}/"
          cp README.md "${STAGE}/"
          7z a -tzip "dist-artifacts/BrootLite-Stream-${VERSION}-windows-x86_64.zip" "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist-artifacts/*.zip

  publish-release:
    name: Attach Prebuilts to GitHub Release
    needs: [android-tv, macos-arm64, linux-x86_64, windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
