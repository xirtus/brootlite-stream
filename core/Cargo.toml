[package]
name = "brootlite-core"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight shared Rust core engine for BrootLite across macOS (Swift 6 C-ABI), Linux (iced), and Windows."
license = "GPL-3.0-only"

[lib]
name = "brootlite_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
urlencoding = "2.1"
quick-xml = "0.37"
regex = "1.11"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
boa_engine = "0.20"
